name: ai_hallucination_detection_system

services:
  # ── PostgreSQL (with pgvector) ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: detection_admin
      POSTGRES_PASSWORD: detection_pass
      POSTGRES_DB: ai_detection
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detection_admin -d ai_detection"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Backend (FastAPI + CUDA) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # Override DB URLs to use Docker service names
      DATABASE_URL: "postgresql+asyncpg://detection_admin:detection_pass@postgres:5432/ai_detection"
      DATABASE_URL_SYNC: "postgresql://detection_admin:detection_pass@postgres:5432/ai_detection"
      WEB_SEARCH_ENABLED: "True"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
