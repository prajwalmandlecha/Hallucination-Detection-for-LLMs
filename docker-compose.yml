version: "3.8"

services:
  # ── PostgreSQL (with pgvector + Apache AGE) ─────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hallucination-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hallucination_db
    ports:
      - "5433:5432"
    volumes:
      - hallucination_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hallucination-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hallucination_postgres_data:
  redis_data:
